name: Generate wasm

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/wasm.yml
      - Cargo.toml
      - Cargo.lock
      - mrubyedge/**
      - mrubyedge-cli/**
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/wasm.yml
      - Cargo.toml
      - Cargo.lock
      - mrubyedge/**
      - mrubyedge-cli/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    env:
      MRUBYEDGE_LOCAL_CRATE_PATH: ${{ github.workspace }}/mrubyedge
    steps:
      - uses: actions/checkout@v5
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
      - name: Install wasm target
        run: rustup target add wasm32-wasip1
      - name: Build wasm artifact
        run: |
          mkdir -p dist
          cargo run -p mrubyedge-cli -- wasm mrubyedge/benches/hello.rb -o dist/hello.wasm --debug-mruby-edge
      - name: Upload wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: mrubyedge-wasm
          path: dist/hello.wasm
